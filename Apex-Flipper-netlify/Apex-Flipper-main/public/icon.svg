<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with squircle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Market Grid Lines -->
  <line x1="64" y1="160" x2="448" y2="160" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="64" y1="352" x2="448" y2="352" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Candlestick 1 -->
  <line x1="150" y1="210" x2="150" y2="380" stroke="#34d399" stroke-width="5" />
  <rect x="130" y="240" width="40" height="110" rx="6" fill="#10b981" />

  <!-- Candlestick 2 -->
  <line x1="256" y1="140" x2="256" y2="360" stroke="#60a5fa" stroke-width="5" />
  <rect x="236" y="170" width="40" height="130" rx="6" fill="#3b82f6" />

  <!-- Candlestick 3 (Apex) -->
  <line x1="362" y1="110" x2="362" y2="330" stroke="#34d399" stroke-width="5" />
  <rect x="342" y="130" width="40" height="140" rx="6" fill="#10b981" />

  <!-- Upward Trendline / Apex Arrow with Glow -->
  <path d="M 110 330 L 210 240 L 290 280 L 410 120" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Arrow Head -->
  <polygon points="410,120 375,125 395,155" fill="#f59e0b" filter="url(#glow)" />
</svg>