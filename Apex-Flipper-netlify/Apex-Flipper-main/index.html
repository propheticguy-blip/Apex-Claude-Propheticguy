    <script>
      // Ignore WebSocket / HMR connection errors in AI Studio iframe environment as specified in guidelines
      (function () {
        var isHmrError = function (str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf('WebSocket') !== -1 ||
            s.indexOf('@vite/client') !== -1 ||
            s.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            s.indexOf('vite-hmr') !== -1
          );
        };

        window.onerror = function (msg, url, lineNo, columnNo, error) {
          if (
            isHmrError(msg) ||
            isHmrError(url) ||
            (error && isHmrError(error.stack))
          ) {
            return true;
          }
        };

        window.addEventListener(
          'error',
          function (event) {
            if (
              isHmrError(event.message) ||
              isHmrError(event.filename) ||
              (event.error && isHmrError(event.error.stack))
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (
              isHmrError(event.reason) ||
              (event.reason && isHmrError(event.reason.message)) ||
              (event.reason && isHmrError(event.reason.stack))
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        // Suppress [vite] console.error for websocket connection failures in AI Studio environment
        if (typeof console !== 'undefined' && console.error) {
          var origConsoleError = console.error;
          console.error = function () {
            var firstArg = arguments[0];
            if (
              typeof firstArg === 'string' &&
              firstArg.indexOf('[vite]') !== -1 &&
              (firstArg.indexOf('websocket') !== -1 || firstArg.indexOf('WebSocket') !== -1)
            ) {
              return;
            }
            return origConsoleError.apply(console, arguments);
          };
        }

        // Safe mock for Vite HMR WebSocket so it stays OPEN and never emits unhandled connection failures
        if (typeof window.WebSocket !== 'undefined') {
          var OrigWS = window.WebSocket;
          var SilentWS = function (url, protocols) {
            var isViteSocket =
              protocols === 'vite-hmr' ||
              (typeof url === 'string' &&
                (url.indexOf('token=') !== -1 ||
                  url.indexOf('@vite') !== -1 ||
                  url.indexOf('vite-hmr') !== -1 ||
                  url.indexOf('5173') !== -1));
            if (isViteSocket) {
              var target = new EventTarget();
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.readyState = 1; // Mark immediately as OPEN (1)
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = String(url || '');
              target.send = function () {};
              target.close = function () {};
              return target;
            }
            return new OrigWS(url, protocols);
          };
          SilentWS.prototype = OrigWS.prototype;
          SilentWS.CONNECTING = 0;
          SilentWS.OPEN = 1;
          SilentWS.CLOSING = 2;
          SilentWS.CLOSED = 3;
          window.WebSocket = SilentWS;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
